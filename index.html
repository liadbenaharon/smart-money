<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Smart Money</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ניהול פיננסי אישי</p>
        <h1>הכסף שלי</h1>
      </div>
      <button id="resetBtn" class="ghost-btn" type="button">איפוס</button>
    </header>

    <section class="cards" id="balanceCards">
      <article class="card"><span>Debit</span><strong id="debitBalance">₪0</strong><small>להוצאות שוטפות</small></article>
      <article class="card"><span>מוכן לאשראי</span><strong id="creditBalance">₪0</strong><small id="creditChargeText">חיוב צפוי: ₪0</small></article>
      <article class="card"><span>חיסכון חודשי</span><strong id="monthlyBalance">₪0</strong><small id="monthlyTargetText">יעד: ₪0</small></article>
      <article class="card"><span>חיסכון שנתי</span><strong id="annualBalance">₪0</strong><small id="annualDaysText">—</small></article>
    </section>

    <section class="panel">
      <div class="section-head">
        <div><p class="eyebrow">מחשבון חלוקה</p><h2>נכנס כסף?</h2></div>
      </div>
      <label for="incomeInput">סכום ההכנסה</label>
      <div class="money-input"><span>₪</span><input id="incomeInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1000"></div>
      <button id="calculateBtn" class="primary-btn" type="button">חשב חלוקה מומלצת</button>
      <div id="allocationResult" class="allocation-grid hidden"></div>
      <button id="applyBtn" class="success-btn hidden" type="button">אשר חלוקה ועדכן יתרות</button>
    </section>

    <section class="panel">
      <div class="section-head"><div><p class="eyebrow">מצב אשראי</p><h2>החיוב הקרוב</h2></div></div>
      <div id="creditStatus"></div>
    </section>

    <section class="panel">
      <div class="section-head"><div><p class="eyebrow">הגדרות</p><h2>יתרות וכללים</h2></div></div>
      <form id="settingsForm" class="settings-grid">
        <label>יתרת Debit<input id="setDebit" type="number" min="0" step="0.01"></label>
        <label>כסף שמור לאשראי<input id="setCredit" type="number" min="0" step="0.01"></label>
        <label>חיוב אשראי צפוי<input id="setExpectedCredit" type="number" min="0" step="0.01"></label>
        <label>חיסכון חודשי<input id="setMonthly" type="number" min="0" step="0.01"></label>
        <label>יעד חיסכון חודשי<input id="setMonthlyTarget" type="number" min="0" step="0.01"></label>
        <label>חיסכון שנתי<input id="setAnnual" type="number" min="0" step="0.01"></label>
        <label>תאריך פתיחת חיסכון שנתי<input id="setAnnualDate" type="date"></label>
        <label>מינימום רצוי ב-Debit<input id="setMinimumDebit" type="number" min="0" step="0.01"></label>
        <label>אחוז Debit<input id="pctDebit" type="number" min="0" max="100" step="1"></label>
        <label>אחוז אשראי<input id="pctCredit" type="number" min="0" max="100" step="1"></label>
        <label>אחוז חיסכון חודשי<input id="pctMonthly" type="number" min="0" max="100" step="1"></label>
        <label>אחוז חיסכון שנתי<input id="pctAnnual" type="number" min="0" max="100" step="1"></label>
        <button class="primary-btn full" type="submit">שמור הגדרות</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-head"><div><p class="eyebrow">היסטוריה</p><h2>פעולות אחרונות</h2></div></div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
